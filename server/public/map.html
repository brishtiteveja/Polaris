<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Polaris — Austin dance map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --lamp:#FF4F6E; --ok:#0FB98A; --warn:#FFB020; --bad:#F2545B; --ink:#2A1F35; --dim:#7B7189; --line:rgba(42,31,53,.14); }
  html, body { margin:0; height:100%; background:#FFF5F1; font:15px/1.5 -apple-system, BlinkMacSystemFont, Inter, sans-serif; }
  #map { position:absolute; inset:0; }
  .hud { position:absolute; top:12px; left:12px; right:12px; z-index:5; display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .hud::-webkit-scrollbar { display:none; }
  .pill {
    flex:none; cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--ink);
    background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    box-shadow:0 4px 14px rgba(42,31,53,.10);
  }
  .pill.on { background:var(--lamp); border-color:var(--lamp); color:#fff; }
  .legend {
    position:absolute; bottom:14px; left:12px; z-index:5; display:flex; gap:12px; flex-wrap:wrap;
    background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:14px; padding:9px 13px;
    font-size:11.5px; font-weight:700; color:var(--dim); box-shadow:0 4px 14px rgba(42,31,53,.10);
  }
  .legend i { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }
  .marker {
    width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:17px;
    background:#fff; border:3px solid var(--ring,#C9C4D4); cursor:pointer;
    box-shadow:0 4px 14px rgba(42,31,53,.28); transition:transform .15s;
  }
  .marker:hover { transform:scale(1.18); }
  .marker.off { filter:grayscale(1); opacity:.55; }
  .maplibregl-popup-content { border-radius:16px; padding:14px; min-width:230px; font:inherit; font-size:13px; color:var(--ink); box-shadow:0 12px 34px rgba(42,31,53,.22); }
  .pt { font-weight:800; font-size:15px; margin-bottom:2px; }
  .pv { color:var(--lamp); font-weight:700; }
  .pm { color:var(--dim); font-size:12.5px; }
  .badge { display:inline-block; margin-top:9px; font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; }
  .b-VERIFIED { background:rgba(15,185,138,.14); color:var(--ok); }
  .b-CHANGED { background:rgba(255,176,32,.16); color:#B47700; }
  .b-CANCELLED { background:rgba(242,84,91,.13); color:var(--bad); }
  .b-UNVERIFIED { background:rgba(123,113,137,.12); color:var(--dim); }
  .ev { display:block; margin-top:9px; color:var(--lamp); font-weight:800; text-decoration:none; font-size:12.5px; }
  .shot { margin:-14px -14px 10px; display:block; width:calc(100% + 28px); height:130px; object-fit:cover; border-radius:16px 16px 0 0; }
</style>
</head>
<body>
<div id="map"></div>
<div class="hud" id="days"></div>
<div class="legend">
  <span><i style="background:#0FB98A"></i>IG-verified</span>
  <span><i style="background:#FFB020"></i>Changed</span>
  <span><i style="background:#F2545B"></i>Cancelled</span>
  <span><i style="background:#C9C4D4"></i>Unverified</span>
</div>
<script>
const DAYS = ['ALL','MON','TUE','WED','THU','FRI','SAT','SUN'];
const NAME = { MON:'Mon', TUE:'Tue', WED:'Wed', THU:'Thu', FRI:'Fri', SAT:'Sat', SUN:'Sun' };
const RING = { VERIFIED:'#0FB98A', CHANGED:'#FFB020', CANCELLED:'#F2545B', UNVERIFIED:'#C9C4D4' };
const EMOJI = [[/two-step|country/,'🥾'],[/salsa/,'🔥'],[/bachata/,'🌺'],[/tango/,'🌹'],[/zouk|kizomba/,'🌊'],[/swing|lindy/,'🎷'],[/blues|fusion/,'💫']];
const emo = s => (EMOJI.find(([r]) => r.test((s||[]).join(' ')))||[0,'💃'])[1];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = t => { if(!t) return ''; const [h,m]=t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; };
const cost = e => e.price_usd === 0 ? 'Free!' : e.price_usd != null ? `$${e.price_usd}` : 'Cover varies';
const label = { VERIFIED:'✓ IG-verified', CHANGED:'⚠ Changed — check IG', CANCELLED:'✕ Cancelled per IG', UNVERIFIED:'Not yet verified' };

let day = new Date().toLocaleString('en-US',{weekday:'short',timeZone:'America/Chicago'}).toUpperCase();
if (!DAYS.includes(day)) day = 'ALL';
let markers = [];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center: [-97.752, 30.28], zoom: 10.8, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

const daysEl = document.getElementById('days');
DAYS.forEach(d => {
  const b = document.createElement('button');
  b.className = 'pill' + (d === day ? ' on' : '');
  b.textContent = d === 'ALL' ? 'All week' : NAME[d];
  b.onclick = () => { day = d; [...daysEl.children].forEach(c => c.classList.toggle('on', c === b)); load(); };
  daysEl.appendChild(b);
});

async function load(){
  const r = await fetch(day === 'ALL' ? '/feed' : `/feed?day=${day}`).then(r => r.json());
  markers.forEach(m => m.remove()); markers = [];
  for (const e of r.events) {
    if (!e.location) continue;
    const st = e.status || 'UNVERIFIED';
    const el = document.createElement('div');
    el.className = 'marker' + (st === 'CANCELLED' ? ' off' : '');
    el.style.setProperty('--ring', RING[st]);
    el.textContent = emo(e.styles);
    const url = e.evidence?.post_url || e.ig_profile;
    const img = e.evidence?.image || e.hero_image;
    const popup = new maplibregl.Popup({ offset: 22 }).setHTML(`
      ${img ? `<img class="shot" src="/img?u=${encodeURIComponent(img)}" alt="" />` : ''}
      <div class="pt">${emo(e.styles)} ${esc(e.name)}</div>
      <div class="pv">${esc(e.venue)}</div>
      <div class="pm">${esc(e.area)} · ${NAME[e.day]} ${clock(e.start)} · ${cost(e)}</div>
      <span class="badge b-${st}">${label[st]}</span>
      ${url ? `<a class="ev" href="${esc(url)}" target="_blank">See it on Instagram ↗</a>` : ''}`);
    markers.push(new maplibregl.Marker({ element: el }).setLngLat([e.location.lon, e.location.lat]).setPopup(popup).addTo(map));
  }
}
map.on('load', load);
setInterval(load, 30000); // a live reconcile run visibly recolours the pins
</script>
</body>
</html>
