# Austin Dance Scraper — source registry
# schema_version: 1
# Verified 2026-07-31. Handles confirmed from the org's own site footer where possible,
# otherwise from an indexed public IG profile title. `confidence` records which.
#
# Field notes:
#   kind        aggregator | studio | promoter | venue | artist
#   instagram   handle without the @; null = no account found
#   confidence  site_link (best) | profile_indexed | unconfirmed
#   scrape      how the scraper should treat it
#                 html_calendar  -> parse event pages off the website
#                 ig_only        -> schedule lives on Instagram, no usable site calendar
#                 ig_supplement  -> site is primary, IG catches one-offs / cancellations
#                 auth_required  -> behind a login, needs credentials or manual export

aggregators:
  - id: austin_dance_socials
    name: Austin Dance Socials
    kind: aggregator
    website: https://austindancesocials.com
    event_path: /event/{slug}
    instagram: null            # none exists — site publishes no social account
    confidence: site_link
    scrape: html_calendar
    notes: >
      Primary seed. Static HTML grouped by day of week, no API/JSON feed.
      Their /about states they monitor "30+ Instagram accounts" and refresh
      weekly (IG), monthly (full), quarterly (venue audit) — as of Jul 2026:
      119 events / 46 venues. Treat as the schedule backbone.

  - id: salsa_vida
    name: Salsa Vida (Austin guide)
    kind: aggregator
    website: https://www.salsavida.com/guides/texas/austin/calendar/
    instagram: salsavida
    confidence: site_link
    scrape: html_calendar
    notes: National salsa media site; the IG account is global, not Austin-specific.

  - id: do512
    name: Do512
    kind: aggregator
    website: https://do512.com
    instagram: do512
    confidence: site_link
    scrape: html_calendar
    notes: General Austin events. Also has TikTok @do512austin. Good for venue cross-refs.

